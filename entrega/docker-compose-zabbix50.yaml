services:
  mysql-zabbix:
    image: mysql:8.0.20
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8 --collation-server=utf8_bin
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?configure MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zabbix}
      MYSQL_USER: ${MYSQL_USER:-zabbix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?configure MYSQL_PASSWORD no arquivo .env}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:-%}
    networks: [monitoring-network]
    volumes:
      - ./mysql-zabbix50:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-mysql:centos-5.0.10
    env_file:
      - ./envs/zabbix-server/common.env
      - ./envs/zabbix-server/zabbix50.env
    environment:
      DB_SERVER_HOST: mysql-zabbix
      DB_SERVER_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zabbix}
      MYSQL_USER: ${MYSQL_USER:-zabbix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?configure MYSQL_PASSWORD no arquivo .env}
    depends_on:
      mysql-zabbix:
        condition: service_healthy
    networks: [monitoring-network]
    volumes:
      - ./data_internal/zabbix-server/externalscripts:/usr/lib/zabbix/externalscripts
      - ./data_internal/zabbix-server/alertscripts:/usr/lib/zabbix/alertscripts
    ports:
      - "10151:10051"
    restart: unless-stopped

  zabbix-frontend:
    image: zabbix/zabbix-web-nginx-mysql:alpine-5.0.10
    env_file:
      - ./envs/zabbix-frontend/common.env
      - ./envs/zabbix-frontend/zabbix50.env
    environment:
      DB_SERVER_HOST: mysql-zabbix
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zabbix}
      MYSQL_USER: ${MYSQL_USER:-zabbix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?configure MYSQL_PASSWORD no arquivo .env}
    depends_on:
      mysql-zabbix:
        condition: service_healthy
    ports:
      - "8083:8080"
    networks: [monitoring-network]
    restart: unless-stopped

  proxy-onprem-snmp-ipmi:
    image: zabbix/zabbix-proxy-sqlite3:ubuntu-5.0-latest
    env_file: ./configs/proxy-onprem-snmp-ipmi/proxy.env
    depends_on: [zabbix-server]
    networks: [monitoring-network]
    volumes:
      - proxy-onprem-data:/var/lib/zabbix/db_data
    healthcheck:
      test: ["CMD-SHELL", "pidof zabbix_proxy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  proxy-cloud-web-01:
    image: zabbix/zabbix-proxy-sqlite3:ubuntu-5.0-latest
    env_file: ./configs/proxy-cloud-web-01/proxy.env
    depends_on: [zabbix-server]
    networks: [monitoring-network]
    volumes:
      - proxy-cloud-web-01-data:/var/lib/zabbix/db_data
      - ./secrets/proxy-cloud-web-01.psk:/var/lib/zabbix/enc/proxy-cloud-web-01.psk:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof zabbix_proxy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  proxy-cloud-web-02:
    image: zabbix/zabbix-proxy-sqlite3:ubuntu-5.0-latest
    env_file: ./configs/proxy-cloud-web-02/proxy.env
    depends_on: [zabbix-server]
    networks: [monitoring-network]
    volumes:
      - proxy-cloud-web-02-data:/var/lib/zabbix/db_data
      - ./secrets/proxy-cloud-web-02.psk:/var/lib/zabbix/enc/proxy-cloud-web-02.psk:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof zabbix_proxy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-5.0-latest
    env_file: ./envs/zabbix-agent/zabbix50.env
    depends_on: [zabbix-server]
    ports:
      - "10150:10050"
    networks: [monitoring-network]
    restart: unless-stopped

  # Dispositivo on-premises simulado, consultado exclusivamente via SNMP.
  snmp-device-onprem:
    build: ./lab/snmp-device
    networks: [monitoring-network]
    healthcheck:
      test: ["CMD-SHELL", "pidof snmpd >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Aplicacoes Web locais usadas para comprovar a coleta pelos proxies cloud.
  web-app-cloud-01:
    image: nginx:1.27-alpine
    networks: [monitoring-network]
    volumes:
      - ./lab/web-app-cloud-01/index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web-app-cloud-02:
    image: nginx:1.27-alpine
    networks: [monitoring-network]
    volumes:
      - ./lab/web-app-cloud-02/index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  monitoring-network:
    external: true

volumes:
  proxy-onprem-data:
  proxy-cloud-web-01-data:
  proxy-cloud-web-02-data:
